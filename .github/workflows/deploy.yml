name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

# アクセス権限の設定
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # 👈 21行目のコロン（:）をドット（.）に修正しました！
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 👈 これがロックファイルを探す原因になっています

      - name: Install dependencies
        run: npm ci # 👈 これもロックファイルが必須のコマンドです


      - name: Build
        env:
          CI: false # 👈 念のため警告によるビルド停止を防ぐ設定も追加しました
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
